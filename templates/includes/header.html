<header class="site-header">

    <div class="header-main">
        <div class="container header-inner">

            <a href="{% url 'home' %}" class="logo">
                <span class="logo-mark">⌂</span>

                <span class="logo-text">
                    <strong>Уютный двор</strong>
                    <small>Беседки и вольеры</small>
                </span>
            </a>

            <button
                class="mobile-menu-button"
                type="button"
                aria-label="Открыть меню"
                aria-expanded="false"
                aria-controls="main-navigation"
            >
                <span class="mobile-menu-icon">☰</span>
            </button>

            <nav
                class="main-navigation"
                id="main-navigation"
                aria-label="Основное меню"
            >
                <a href="{% url 'home' %}">Главная</a>

                <a href="{% url 'catalog' 'gazebo' %}">
                    Беседки
                </a>

                <a href="{% url 'catalog' 'aviary' %}">
                    Вольеры
                </a>

                <a href="{% url 'utility_catalog' %}">
                    Хозблоки
                </a>

                <a href="{% url 'consultation_create' %}">
                    Консультация
                </a>

                {% if user.is_authenticated %}

                    <a href="{% url 'dashboard' %}">
                        Личный кабинет
                    </a>

                    <form
                        method="post"
                        action="{% url 'logout' %}"
                        class="logout-form"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="logout-button"
                        >
                            Выйти
                        </button>
                    </form>

                {% else %}

                    <a href="{% url 'login' %}">
                        Войти
                    </a>

                {% endif %}
            </nav>

            <a
                href="{% url 'request_create' %}"
                class="button button-small header-request-button"
            >
                Оставить заявку
            </a>

        </div>
    </div>


    <div class="header-subbar">

        <div class="container subbar-inner">

            <nav
                class="subbar-menu"
                aria-label="Разделы каталога"

                    Каталог беседок
